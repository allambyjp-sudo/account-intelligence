# Local development database: Postgres 16 with pgvector.
# Fictional and public data only. See docs/decisions.md, decision 7.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aip
      POSTGRES_PASSWORD: aip
      POSTGRES_DB: aip
    ports:
      - "5432:5432"
    volumes:
      - aip-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip -d aip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aip-db:
